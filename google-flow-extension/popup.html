<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      color: #1f2937;
      background: #f9fafb;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      color: #111827;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .status-badge.connected {
      background: #dcfce7;
      color: #15803d;
    }
    .status-badge.disconnected {
      background: #fee2e2;
      color: #b91c1c;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 6px;
    }
    .card-value {
      font-size: 13px;
      font-weight: 500;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    .footer {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Flow Connector</h2>
  </div>

  <div id="bridge-status" class="status-badge disconnected">
    <div class="status-dot"></div>
    <span id="bridge-text">Bridge: Checking...</span>
  </div>

  <div class="card">
    <div class="card-label">Google Flow Tab</div>
    <div id="flow-tab-status" class="card-value">Scanning for open tab...</div>
  </div>

  <div class="card">
    <div class="card-label">Workspace Folder</div>
    <div class="card-value" style="font-family: monospace; font-size: 11px;">F:\YT\assets\flow</div>
  </div>

  <button id="open-flow-btn">Open Google Flow</button>

  <div class="footer">
    Antigravity IDE &bull; YouTube Shorts Bridge
  </div>

  <script src="popup.js"></script>
</body>
</html>
